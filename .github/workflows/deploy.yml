# .github/workflows/deploy.yml
name: Deploy to EC2

on:
  push:
    branches: [dracer/base]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/ura-v2_backend
            git pull origin dracer/base
            npm install --omit=dev
            npm run build
            pm2 restart ura-dev-api || pm2 start ecosystem.config.js
